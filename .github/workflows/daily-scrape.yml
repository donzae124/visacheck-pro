name: Daily visa scrape

on:
  schedule:
    # 06:00 Pakistan time (UTC+5) = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Chrome/Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates fonts-liberation \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libdbus-1-3 libgbm1 libgtk-3-0 \
            libnspr4 libnss3 libx11-xcb1 libxcomposite1 \
            libxdamage1 libxrandr2 xdg-utils || \
          sudo apt-get install -y \
            ca-certificates fonts-liberation libgbm1 libnss3 libgtk-3-0

      - name: Install npm packages
        run: npm install

      - name: Run scraper
        run: |
          npm run scrape
          test -f data/live-data.json
          echo "File size:"
          wc -c data/live-data.json
          head -c 300 data/live-data.json || true

      - name: Commit and push live-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/live-data.json
          if git diff --staged --quiet; then
            echo "No changes to live-data.json"
          else
            git commit -m "chore: update live-data.json $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: live-data-json
          path: data/live-data.json
          if-no-files-found: error
