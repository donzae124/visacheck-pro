name: Daily visa scrape

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates fonts-liberation libgbm1 libnss3 libgtk-3-0 libasound2t64 xdg-utils || true

      - name: Install npm packages
        run: npm install

      - name: Run scraper
        run: |
          npm run scrape || node scripts/scrape-daily.js
          test -f data/live-data.json
          wc -c data/live-data.json

      - name: Publish live-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update live-data.json $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: live-data-json
          path: data/live-data.json
